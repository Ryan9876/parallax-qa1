<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#161b18" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Henley & the Pets — Kitchen Roundup</title>
</head>
<body>
  <div id="app">
    <canvas id="scene" aria-label="Henley and the Pets game view"></canvas>
    <div id="hud" class="hud hidden" aria-live="polite">
      <section class="hud-card objective"><span id="cat-dot" class="cat-dot"></span><div><b id="objective-name">Find the pet toy</b><small id="objective-detail">62.0s · 0/2 pets</small></div></section>
      <section class="hud-card score"><b id="score">0</b><small id="combo">0/2 home</small></section>
      <section class="hud-card stars" id="stars">TOY ○</section>
      <button id="pause-button" class="pause-button" aria-label="Pause">II</button>
    </div>
    <div id="henley-indicator" class="henley-indicator hidden"></div>
    <div id="drag-ripple" class="drag-ripple hidden"></div>
    <div id="first-run-guide" class="first-run-guide hidden" aria-hidden="true">
      <div class="guide-stage">
        <span class="guide-ring"></span>
        <span class="guide-dot guide-dot-a"></span>
        <span class="guide-dot guide-dot-b"></span>
        <span class="guide-stroke"></span>
      </div>
      <small id="first-run-guide-text"></small>
    </div>
    <div id="toast" class="toast hidden"></div>
    <div id="screen-root" class="screen-root"></div>
    <div id="pause-banner" class="pause-banner hidden"><b>Paused</b><span id="pause-reason">Tap Resume when ready.</span></div>
    <div id="build" class="build"></div>
    <button id="qa-indicator" class="qa-indicator hidden" aria-label="QA status">QA</button>
    <pre id="qa-panel" class="qa-panel hidden"></pre>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
