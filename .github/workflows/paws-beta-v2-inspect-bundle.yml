name: Inspect Paws Beta V2 Bundle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paws-beta-v2-inspect-bundle.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress staged game bundle
        run: |
          cat paws-beta-v2-stage/chunk-{0..6}.txt | base64 -d | gzip -dc > /tmp/paws-beta-v2-source.js
          wc -c /tmp/paws-beta-v2-source.js
      - name: Report imports and asset/network references
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/paws-beta-v2-source.js').read_text(errors='replace')
          pats={
            'imports': r'(?:from\s*["\'][^"\']+["\']|import\s*\(["\'][^"\']+["\']\))',
            'urls': r'https?://[^"\'\s)]+',
            'fetches': r'fetch\s*\([^)]{0,220}\)',
            'assets': r'["\'][^"\']+\.(?:glb|gltf|bin|png|jpg|jpeg|webp|ktx2|hdr|wav|mp3|ogg|m4a|json)[^"\']*["\']',
          }
          for name,pat in pats.items():
            print(f'\n=== {name.upper()} ===')
            vals=[]
            for m in re.finditer(pat,s,re.I):
              v=m.group(0)
              if v not in vals: vals.append(v)
            for v in vals[:250]: print(v[:500])
            print('COUNT',len(vals))
          print('\n=== FETCH CONTEXTS ===')
          for m in re.finditer(r'fetch',s):
            print(s[max(0,m.start()-180):m.start()+400].replace('\n',' ')[:650])
          PY
