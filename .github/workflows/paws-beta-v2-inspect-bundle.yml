name: Inspect Paws Beta V2 Bundle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paws-beta-v2-inspect-bundle.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staged encoding
        run: |
          python3 - <<'PY'
          import base64,gzip,zlib
          from pathlib import Path
          parts=[]
          for i in range(7):
            s=Path(f'paws-beta-v2-stage/chunk-{i}.txt').read_text().strip()
            parts.append(s)
            print(f'chunk {i}: chars={len(s)} prefix={s[:16]!r} suffix={s[-16:]!r} padding={s.count("=")}')
            try:
              b=base64.b64decode(s,validate=True)
              print(f'  individual decoded={len(b)} first={b[:12].hex()} last={b[-12:].hex()}')
            except Exception as e: print('  individual decode error',repr(e))
          joined=''.join(parts)
          print('joined chars',len(joined),'mod4',len(joined)%4,'padding',joined.count('='))
          b=base64.b64decode(joined,validate=True)
          print('joined decoded',len(b),'first',b[:24].hex(),'last',b[-24:].hex())
          for name,fn in [('gzip',gzip.decompress),('zlib',zlib.decompress)]:
            try:
              out=fn(b)
              print(name,'SUCCESS bytes',len(out),'head',out[:160])
            except Exception as e: print(name,'ERROR',repr(e))
          # Also test concatenating independently-decoded chunks.
          try:
            bb=b''.join(base64.b64decode(x) for x in parts)
            print('piecewise decoded',len(bb),'first',bb[:24].hex(),'last',bb[-24:].hex())
            for name,fn in [('piecewise-gzip',gzip.decompress),('piecewise-zlib',zlib.decompress)]:
              try:
                out=fn(bb)
                print(name,'SUCCESS bytes',len(out),'head',out[:160])
              except Exception as e: print(name,'ERROR',repr(e))
          except Exception as e: print('piecewise ERROR',repr(e))
          PY
