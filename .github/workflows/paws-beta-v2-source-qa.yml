name: Paws Beta V2 Source QA
on:
  push:
    branches: [paws-beta-v2-compression]
    paths:
      - 'paws-beta-v2-app/**'
      - '.github/workflows/paws-beta-v2-source-qa.yml'
permissions:
  contents: write
concurrency:
  group: paws-beta-v2-compression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: paws-beta-v2-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compressed runtime loaders
        run: node scripts/apply-compression-runtime.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Contract tests
        run: npm run test:contracts
      - name: Generate compressed assets and build
        run: npm run build
      - name: Release asset compression and budgets
        run: npm run test:asset-budget
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview > /tmp/paws-preview.log 2>&1 &
          echo $! > /tmp/paws-preview.pid
          sleep 3
      - name: Browser gameplay QA
        run: node scripts/browser-qa.mjs
      - name: Authored visual and same-origin QA
        run: node scripts/runtime-origin-qa.mjs
      - name: First-run comprehension QA
        run: node scripts/onboarding-qa.mjs
      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paws-beta-v2-compression-evidence
          path: paws-beta-v2-app/qa-results
          if-no-files-found: warn
      - name: Commit verified compression conversion
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/paws-beta-v2-source-qa.yml
          git rm -f .github/workflows/paws-beta-v2-compression-qa.yml || true
          git rm -f paws-beta-v2-app/scripts/apply-compression-runtime.mjs
          git add paws-beta-v2-app/src/scene.js paws-beta-v2-app/src/game.js paws-beta-v2-app/scripts/asset-budget.mjs paws-beta-v2-app/package-lock.json .github/workflows/paws-beta-v2-source-qa.yml
          git commit -m 'Load KTX2 textures and Meshopt geometry'
          git push
